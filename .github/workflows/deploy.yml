name: Deploy gallardo-crowdfunding

on:
  push:
    branches:
      - master
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Variables de entorno de prueba
        run: |
          {
            echo "PUBLIC_SUPABASE_URL=https://example.supabase.co"
            echo "PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key-0000000000000000"
            echo "SUPABASE_SERVICE_ROLE_KEY=ci-placeholder-service-key-000000000000"
          } > .env
      - run: npm run check
      - run: npm run lint
      - run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_BASE: /var/www/gallardo-crowdfunding
      RELEASE: ${{ github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Astro incrusta las variables en el build: el .env real tiene que existir aquí.
      # El secret va por variable de entorno: interpolarlo dentro del script rompe si
      # un valor lleva comillas o "<" (p. ej. MAIL_FROM="Nombre <correo>").
      - name: Crear .env desde el secret
        env:
          ENV_LOCAL: ${{ secrets.ENV_LOCAL }}
        run: printf '%s\n' "$ENV_LOCAL" > .env

      - run: npm run build

      - name: Verificar dist
        run: |
          test -f dist/server/entry.mjs || { echo "dist/server/entry.mjs no existe"; exit 1; }
          ls -la dist

      - name: Preparar directorio de release en el servidor
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            mkdir -p "${{ env.DEPLOY_BASE }}/releases/${{ env.RELEASE }}"

      - name: Subir build
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'dist/*'
          target: ${{ env.DEPLOY_BASE }}/releases/${{ env.RELEASE }}
          strip_components: 1

      - name: Subir package.json, lockfile y ecosystem
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'package.json,package-lock.json,ecosystem.config.cjs'
          target: ${{ env.DEPLOY_BASE }}/releases/${{ env.RELEASE }}

      - name: Activar release y recargar PM2
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 22 || nvm install 22

            BASE="${{ env.DEPLOY_BASE }}"
            REL="$BASE/releases/${{ env.RELEASE }}"
            cd "$REL"

            cat > .env << 'ENVEOF'
            ${{ secrets.ENV_LOCAL }}
            ENVEOF
            chmod 600 .env

            echo "Instalando dependencias de producción..."
            npm ci --omit=dev --legacy-peer-deps

            # Cambio atómico del symlink: la release anterior sigue sirviendo hasta el reload.
            ln -sfn "$REL" "$BASE/current.tmp"
            mv -Tf "$BASE/current.tmp" "$BASE/current"

            # Si PM2 aún apunta al layout antiguo (server/entry.mjs en la raíz), se recrea el proceso.
            OLD_PATH=$(pm2 jlist 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const a=JSON.parse(d||"[]").find(p=>p.name==="gallardo-crowdfunding");console.log(a?a.pm2_env.pm_exec_path:"")})')
            if [ -n "$OLD_PATH" ] && [[ "$OLD_PATH" != *"/current/"* ]]; then
              echo "Eliminando proceso PM2 antiguo ($OLD_PATH)"
              pm2 delete gallardo-crowdfunding || true
            fi

            pm2 startOrReload "$BASE/current/ecosystem.config.cjs" --update-env
            pm2 save

            echo "Limpiando releases antiguas (se conservan 3)..."
            ls -1dt "$BASE"/releases/* | tail -n +4 | xargs -r rm -rf

            echo "Deploy completado: https://gc.gallardcode.com"
